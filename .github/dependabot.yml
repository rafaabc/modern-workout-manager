version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      frontend-build-tooling-major:
        patterns:
          - 'vite'
          - '@vitejs/plugin-vue'
        update-types:
          - 'major'
      frontend-test-tooling-major:
        patterns:
          - 'vitest'
          - '@vitest/coverage-v8'
        update-types:
          - 'major'
      frontend-runtime-major:
        patterns:
          - 'vue'
          - 'vue-router'
          - 'pinia'
        update-types:
          - 'major'
      linting-major:
        patterns:
          - 'eslint'
          - '@eslint/js'
          - 'eslint-plugin-vue'
          - 'eslint-plugin-security'
        update-types:
          - 'major'
      backend-test-tooling-major:
        patterns:
          - 'mongodb-memory-server'
        update-types:
          - 'major'
      backend-runtime-major:
        patterns:
          - 'express'
          - 'mongoose'
        update-types:
          - 'major'
      frontend-styling-major:
        patterns:
          - 'tailwindcss'
          - 'postcss'
          - 'autoprefixer'
        update-types:
          - 'major'
      dev-tooling-major:
        patterns:
          - 'c8'
          - 'jsdom'
          - '@vite-pwa/assets-generator'
        update-types:
          - 'major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
