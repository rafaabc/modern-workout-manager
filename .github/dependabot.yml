version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      major-frontend:
        patterns:
          - 'vite'
          - '@vitejs/plugin-vue'
          - 'vitest'
          - '@vitest/coverage-v8'
          - 'vue'
          - 'vue-router'
          - 'pinia'
          - 'tailwindcss'
          - '@tailwindcss/postcss'
          - 'postcss'
        update-types:
          - 'major'
      major-backend:
        patterns:
          - 'express'
          - 'mongoose'
          - 'mongodb-memory-server'
        update-types:
          - 'major'
      major-tooling:
        patterns:
          - 'eslint'
          - '@eslint/js'
          - 'eslint-plugin-vue'
          - 'eslint-plugin-security'
          - 'c8'
          - 'jsdom'
          - '@vite-pwa/assets-generator'
        update-types:
          - 'major'
    cooldown:
      default-days: 7

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
